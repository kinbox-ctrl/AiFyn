<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#F7FAFA" />
        <!-- Apply saved / system theme before first paint (no flash) -->
        <script>
            (function () {
                var t;
                try { t = localStorage.getItem("aifyn-theme"); } catch (e) {}
                if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.dataset.theme = t;
                if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#061414");
            })();
        </script>
        <title>AiFyn — Your cameras see everything. AiFyn understands it.</title>
        <meta
            name="description"
            content="AiFyn turns your existing CCTV into an intelligent, always-on security and operations layer. AI video analytics that thinks, alerts and acts — 24/7. Ai For Your Needs."
        />
        <meta name="keywords" content="AI video analytics, CCTV intelligence, surveillance AI, PPE detection, ANPR, footfall analytics, AiFyn, AccoFyn" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="canonical" href="%VITE_SITE_URL%/" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="AiFyn — Ai For Your Needs" />
        <meta property="og:title" content="AiFyn — See Everything. Miss Nothing." />
        <meta property="og:description" content="AI video analytics that makes your existing CCTV think, alert and act — 24/7." />
        <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
        <meta property="og:url" content="%VITE_SITE_URL%/" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="AiFyn — See Everything. Miss Nothing." />
        <meta name="twitter:description" content="AI video analytics that makes your existing CCTV think, alert and act — 24/7." />
        <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

        <!-- Fonts: Sora (display) / Inter (body) / JetBrains Mono (system labels) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <!-- Schema.org -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "AiFyn",
                "description": "AI-powered video analytics and security surveillance. Ai For Your Needs.",
                "url": "%VITE_SITE_URL%/",
                "logo": "%VITE_SITE_URL%/favicon.svg",
                "email": "hello@aifyn.in",
                "telephone": "+91-9355570800",
                "parentOrganization": { "@type": "Organization", "name": "AccoFyn" },
                "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "Delhi · Gurugram · Noida · Goa · Yamunanagar",
                    "addressCountry": "IN"
                }
            }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
